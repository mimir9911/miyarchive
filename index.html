<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>miya</title>
<meta name="description" content="Writing portfolio">
<script>
  // Apply the saved theme before the page paints, so it doesn't flash.
  (function () {
    var t, s;
    try { t = localStorage.getItem('theme'); s = localStorage.getItem('sidebar'); } catch (e) {}
    document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
    // The sidebar starts collapsed for new visitors; it only stays open if they opened it.
    if (s !== 'open') document.documentElement.setAttribute('data-sidebar', 'collapsed');
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="iconbtn menu" id="menu" type="button" aria-label="Show library" aria-expanded="false" title="Show library">
      <svg viewBox="0 0 27 26" width="17" height="16.4" fill="none" stroke="currentColor" stroke-width="2.8" aria-hidden="true"><path d="M1.5 0V26M9.5 0V26"/><path d="M17.5 1.4H20.6a5 5 0 0 1 5 5V24.6H17.5Z"/></svg>
    </button>
    <div class="topmid">
      <a class="iconbtn" href="#/" aria-label="Home">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M12 2.7 2.5 10.4V21.5h7v-6.5h5v6.5h7V10.4L12 2.7z"/></svg>
      </a>
      <div class="search" id="search">
        <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="What do you want to read?" autocomplete="off" spellcheck="false" aria-label="Search">
        <div class="results" id="results"></div>
      </div>
    </div>
    <button class="iconbtn toggle" id="theme" type="button" aria-label="Switch to light mode" title="Switch to light mode">
      <svg class="t-sun" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="t-moon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>
  <aside class="sidebar" id="side"></aside>
  <main class="main" id="main"></main>
</div>
<div class="player" id="player"></div>
<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
